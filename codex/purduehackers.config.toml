# Layered over personal Codex settings with --profile purduehackers.

[mcp_servers.vercel]
url = "https://mcp.vercel.com"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
http_headers_helper = 'bun --no-env-file "$HOME/.config/purduehackers/codex/headers.ts" github'

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.sentry]
url = "https://mcp.sentry.dev/mcp"

[mcp_servers.cloudflare]
url = "https://mcp.cloudflare.com/mcp"

[mcp_servers.hunter]
url = "https://mcp.hunter.io/mcp"
http_headers_helper = 'bun --env-file "$HOME/.config/purduehackers/.env.local" "$HOME/.config/purduehackers/codex/headers.ts" hunter'

[mcp_servers.serpapi]
url = "https://mcp.serpapi.com/mcp"
http_headers_helper = 'bun --env-file "$HOME/.config/purduehackers/.env.local" "$HOME/.config/purduehackers/codex/headers.ts" serpapi'

# Payload MCP keys are separate from service-account REST keys.
[mcp_servers.cms]
url = "https://cms.purduehackers.com/api/mcp"
enabled = false
http_headers_helper = 'bun --env-file "$HOME/.config/purduehackers/.env.local" "$HOME/.config/purduehackers/codex/headers.ts" cms'
